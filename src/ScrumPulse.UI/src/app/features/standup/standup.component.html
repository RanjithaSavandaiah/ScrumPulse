<section class="animate-fade-in standup-section">
  <!--
    Voice capture sits above the feed rather than inside the log dialog: it replaces the whole
    manual flow rather than being a field within it, and the Scrum Master reaches for it at the
    start of the ceremony.
  -->
  @if (state.isScrumMaster()) {
    <div class="scribe-launch">
      <button type="button" class="btn-voice-scribe" (click)="openVoiceScribe()">
        <span class="voice-icon" aria-hidden="true">&#127908;</span>
        <span class="voice-label">
          <strong>Log standup by voice</strong>
          <small>Capture the call and let the assistant write each person's update</small>
        </span>
      </button>
    </div>
  }

  <div class="standup-grid">
    <app-standup-feed
      [standups]="state.standups()"
      (logStandup)="openCreateStandup()"
      (editStandup)="openEditStandup($event)"
    ></app-standup-feed>

    <app-standup-timer
      [seconds]="timerSeconds()"
      [isRunning]="timerRunning()"
      [members]="contributingMembers()"
      [currentSpeakerIndex]="currentSpeakerIndex()"
      (toggle)="toggleTimer()"
      (reset)="resetTimer()"
      (nextSpeaker)="nextSpeaker()"
      (selectSpeaker)="selectSpeaker($event)"
    ></app-standup-timer>
  </div>

  <!-- Voice scribe: captures the meeting audio and logs the updates -->
  @if (showScribeModal()) {
    <app-standup-scribe-modal
      [sprintId]="state.activeSprint()?.id ?? null"
      (standupsLogged)="onScribeLogged($event)"
      (closed)="showScribeModal.set(false)"
    ></app-standup-scribe-modal>
  }

  <!-- Log / Edit Standup Modal -->
  @if (showStandupModal()) {
    <app-log-standup-modal
      [members]="contributingMembers()"
      [editStandup]="selectedEditStandup()"
      (close)="showStandupModal.set(false); selectedEditStandup.set(null)"
      (save)="onSaveStandup($event)"
      (delete)="onDeleteStandup($event)"
    ></app-log-standup-modal>
  }
</section>
