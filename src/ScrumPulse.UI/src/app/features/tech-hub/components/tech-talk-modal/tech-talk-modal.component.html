<div class="modal-backdrop animate-fade-in" (click)="close.emit()">
  <div class="modal-box glass-panel glow-border animate-slide-up" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <div class="header-title-wrap">
        <app-icon name="mic" [size]="22" color="var(--accent-secondary)"></app-icon>
        <div>
          <h3 class="modal-title">{{ techTalk ? 'Edit Tech Sharing Session' : 'Schedule / Log Tech Talk' }}</h3>
          <p class="modal-subtitle">Record offshore knowledge sharing, architecture demos, and learnings</p>
        </div>
      </div>
      <button (click)="close.emit()" class="close-btn" title="Close">&times;</button>
    </div>

    <!-- Body -->
    <form (ngSubmit)="onSubmit()" class="modal-body form-grid">
      <!-- Topic -->
      <div class="form-group full-width">
        <label for="techTalkTopicInput" class="form-label">Session Topic & Theme <span class="required-star">*</span></label>
        <input
          id="techTalkTopicInput"
          type="text"
          [(ngModel)]="topic"
          name="topic"
          required
          placeholder="e.g. CQRS & Event Sourcing Architecture in .NET 9"
          class="interactive-input"
        />
      </div>

      <!-- Presenter & Date -->
      <div class="form-row">
        <div class="form-group">
          <label for="techTalkPresenterSelect" class="form-label">Presenter / Speaker <span class="required-star">*</span></label>
          <select id="techTalkPresenterSelect" [(ngModel)]="presenterId" name="presenterId" required class="interactive-input">
            @for (m of state.squadMembers(); track m.id) {
              <option [value]="m.id">{{ m.name | cleanName }} ({{ m.role | roleLabel }})</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="techTalkDateInput" class="form-label">Session Date</label>
          <input
            id="techTalkDateInput"
            type="date"
            [(ngModel)]="talkDate"
            name="talkDate"
            required
            class="interactive-input"
          />
        </div>
      </div>

      <!-- Duration & Slides/Recording URL -->
      <div class="form-row">
        <div class="form-group">
          <label for="techTalkDurationSelect" class="form-label">Duration</label>
          <select id="techTalkDurationSelect" [(ngModel)]="durationMinutes" name="durationMinutes" class="interactive-input">
            @for (d of durations; track d.value) {
              <option [value]="d.value">{{ d.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="techTalkSlidesUrlInput" class="form-label">Slides / Recording URL (Optional)</label>
          <input
            id="techTalkSlidesUrlInput"
            type="url"
            [(ngModel)]="slidesUrl"
            name="slidesUrl"
            placeholder="https://slides.com/..."
            class="interactive-input"
          />
        </div>
      </div>

      <!-- Key Takeaways -->
      <div class="form-group full-width">
        <label for="techTalkTakeawaysTextarea" class="form-label">Key Takeaways & Team Action Items</label>
        <textarea
          id="techTalkTakeawaysTextarea"
          [(ngModel)]="keyTakeaways"
          name="keyTakeaways"
          rows="4"
          placeholder="Summary of learnings, architectural patterns introduced, repo demo links..."
          class="interactive-textarea"
        ></textarea>
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer footer-split">
        <div class="footer-left">
          @if (techTalk) {
            <button type="button" (click)="onDelete()" class="btn-danger">
              <app-icon name="trash" [size]="16"></app-icon> Delete Session
            </button>
          }
        </div>
        <div class="footer-right">
          <button type="button" (click)="close.emit()" [disabled]="isSubmitting()" class="btn-secondary">Cancel</button>
          <button type="submit" [disabled]="!topic.trim() || !presenterId || isSubmitting()" class="btn-primary">
            <app-icon [name]="isSubmitting() ? 'loader' : 'check'" [size]="16"></app-icon>
            {{ isSubmitting() ? 'Saving...' : (techTalk ? 'Save Changes' : 'Log Tech Talk') }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
