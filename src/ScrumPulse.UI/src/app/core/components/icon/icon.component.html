<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  [attr.stroke]="color || 'currentColor'"
  [attr.stroke-width]="strokeWidth"
  stroke-linecap="round"
  stroke-linejoin="round"
  [class]="extraClass"
  aria-hidden="true"
  class="svg-icon"
  [ngSwitch]="name"
>
  <!-- Zap / Lightning -->
  <g *ngSwitchCase="'zap'">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
  </g>

  <!-- Clock / Timer -->
  <g *ngSwitchCase="'clock'">
    <circle cx="12" cy="12" r="10"></circle>
    <polyline points="12 6 12 12 16 14"></polyline>
  </g>

  <!-- Bot / AI -->
  <g *ngSwitchCase="'bot'">
    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
    <circle cx="12" cy="5" r="2"></circle>
    <path d="M12 7v4"></path>
    <line x1="8" y1="16" x2="8" y2="16"></line>
    <line x1="16" y1="16" x2="16" y2="16"></line>
  </g>

  <!-- Shield Alert / Blocker SLA -->
  <g *ngSwitchCase="'shield-alert'">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </g>

  <!-- Users / Daily Standup -->
  <g *ngSwitchCase="'users'">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
  </g>

  <!-- Calendar / Capacity -->
  <g *ngSwitchCase="'calendar'">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>
    <line x1="8" y1="2" x2="8" y2="6"></line>
    <line x1="3" y1="10" x2="21" y2="10"></line>
  </g>

  <!-- Palmtree / Leave -->
  <g *ngSwitchCase="'palmtree'">
    <path d="M13 8c0-2.76-2.46-5-5.5-5S2 5.24 2 8h11z"></path>
    <path d="M13 7.14A5.82 5.82 0 0 1 16.5 6c3.04 0 5.5 2.24 5.5 5h-9"></path>
    <path d="M5.8 21a14.5 14.5 0 0 1 7.2-13.8"></path>
    <path d="M9 21h6"></path>
  </g>

  <!-- File Text / Monthly 1:1 Reviews -->
  <g *ngSwitchCase="'file-text'">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <line x1="16" y1="13" x2="8" y2="13"></line>
    <line x1="16" y1="17" x2="8" y2="17"></line>
    <polyline points="10 9 9 9 8 9"></polyline>
  </g>

  <!-- Rotate CW / Retrospective -->
  <g *ngSwitchCase="'rotate-cw'">
    <polyline points="23 4 23 10 17 10"></polyline>
    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
  </g>

  <!-- Award / Kudos -->
  <g *ngSwitchCase="'award'">
    <circle cx="12" cy="8" r="7"></circle>
    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
  </g>

  <!-- Book Open / Tech Debt Hub -->
  <g *ngSwitchCase="'book-open'">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
  </g>

  <!-- Bar Chart / Executive Suite -->
  <g *ngSwitchCase="'bar-chart'">
    <line x1="12" y1="20" x2="12" y2="10"></line>
    <line x1="18" y1="20" x2="18" y2="4"></line>
    <line x1="6" y1="20" x2="6" y2="16"></line>
    <line x1="2" y1="20" x2="22" y2="20"></line>
  </g>

  <!-- Git Pull Request -->
  <g *ngSwitchCase="'git-pull-request'">
    <circle cx="18" cy="18" r="3"></circle>
    <circle cx="6" cy="6" r="3"></circle>
    <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
    <line x1="6" y1="9" x2="6" y2="21"></line>
  </g>

  <!-- Git Merge -->
  <g *ngSwitchCase="'git-merge'">
    <circle cx="18" cy="18" r="3"></circle>
    <circle cx="6" cy="6" r="3"></circle>
    <path d="M6 21V9a9 9 0 0 0 9 9"></path>
  </g>

  <!-- Git Branch -->
  <g *ngSwitchCase="'git-branch'">
    <line x1="6" y1="3" x2="6" y2="15"></line>
    <circle cx="18" cy="6" r="3"></circle>
    <circle cx="6" cy="18" r="3"></circle>
    <path d="M18 9a9 9 0 0 1-9 9"></path>
  </g>

  <!-- Check Circle / Done -->
  <g *ngSwitchCase="'check-circle'">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
    <polyline points="22 4 12 14.01 9 11.01"></polyline>
  </g>

  <!-- Shield Check / Quality Gates -->
  <g *ngSwitchCase="'shield-check'">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    <polyline points="9 12 11 14 15 10"></polyline>
  </g>

  <!-- Eye / PR Review -->
  <g *ngSwitchCase="'eye'">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </g>

  <!-- Play / Start Timer -->
  <g *ngSwitchCase="'play'">
    <polygon points="5 3 19 12 5 21 5 3"></polygon>
  </g>

  <!-- Pause / Pause Timer -->
  <g *ngSwitchCase="'pause'">
    <rect x="6" y="4" width="4" height="16"></rect>
    <rect x="14" y="4" width="4" height="16"></rect>
  </g>

  <!-- Rotate CCW / Reset Timer -->
  <g *ngSwitchCase="'rotate-ccw'">
    <polyline points="1 4 1 10 7 10"></polyline>
    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
  </g>

  <!-- Arrow Right -->
  <g *ngSwitchCase="'arrow-right'">
    <line x1="5" y1="12" x2="19" y2="12"></line>
    <polyline points="12 5 19 12 12 19"></polyline>
  </g>

  <!-- Flask / QA Testing -->
  <g *ngSwitchCase="'flask'">
    <path d="M10 2v7.31a2 2 0 0 1-.37 1.17l-5.26 7.9A2 2 0 0 0 6 21h12a2 2 0 0 0 1.63-2.62l-5.26-7.9A2 2 0 0 1 14 9.31V2"></path>
    <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
    <path d="M14 9.3a6.5 6.5 0 0 1-4 0"></path>
  </g>

  <!-- Plus -->
  <g *ngSwitchCase="'plus'">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </g>

  <!-- Alert Triangle -->
  <g *ngSwitchCase="'alert-triangle'">
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
    <line x1="12" y1="9" x2="12" y2="13"></line>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </g>

  <!-- Alert Circle -->
  <g *ngSwitchCase="'alert-circle'">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </g>

  <!-- Sparkles / AI Coaching -->
  <g *ngSwitchCase="'sparkles'">
    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
    <path d="M5 3v4"></path>
    <path d="M19 17v4"></path>
    <path d="M3 5h4"></path>
    <path d="M17 19h4"></path>
  </g>

  <!-- User -->
  <g *ngSwitchCase="'user'">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </g>

  <!-- Target -->
  <g *ngSwitchCase="'target'">
    <circle cx="12" cy="12" r="10"></circle>
    <circle cx="12" cy="12" r="6"></circle>
    <circle cx="12" cy="12" r="2"></circle>
  </g>

  <!-- Building -->
  <g *ngSwitchCase="'building'">
    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
    <path d="M9 22v-4h6v4"></path>
    <line x1="8" y1="6" x2="8.01" y2="6"></line>
    <line x1="16" y1="6" x2="16.01" y2="6"></line>
    <line x1="8" y1="10" x2="8.01" y2="10"></line>
    <line x1="16" y1="10" x2="16.01" y2="10"></line>
    <line x1="8" y1="14" x2="8.01" y2="14"></line>
    <line x1="16" y1="14" x2="16.01" y2="14"></line>
  </g>

  <!-- Send -->
  <g *ngSwitchCase="'send'">
    <line x1="22" y1="2" x2="11" y2="13"></line>
    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
  </g>

  <!-- Message Square -->
  <g *ngSwitchCase="'message-square'">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </g>

  <!-- Message Circle -->
  <g *ngSwitchCase="'message-circle'">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
  </g>

  <!-- Sun -->
  <g *ngSwitchCase="'sun'">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </g>

  <!-- Moon -->
  <g *ngSwitchCase="'moon'">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </g>

  <!-- Refresh CW -->
  <g *ngSwitchCase="'refresh-cw'">
    <polyline points="23 4 23 10 17 10"></polyline>
    <polyline points="1 20 1 14 7 14"></polyline>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
  </g>

  <!-- Thumbs Up -->
  <g *ngSwitchCase="'thumbs-up'">
    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
  </g>

  <!-- Smile -->
  <g *ngSwitchCase="'smile'">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
    <line x1="9" y1="9" x2="9.01" y2="9"></line>
    <line x1="15" y1="9" x2="15.01" y2="9"></line>
  </g>

  <!-- Frown -->
  <g *ngSwitchCase="'frown'">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
    <line x1="9" y1="9" x2="9.01" y2="9"></line>
    <line x1="15" y1="9" x2="15.01" y2="9"></line>
  </g>

  <!-- Lightbulb -->
  <g *ngSwitchCase="'lightbulb'">
    <path d="M9 18h6"></path>
    <path d="M10 22h4"></path>
    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5h6.18z"></path>
  </g>

  <!-- Check Square -->
  <g *ngSwitchCase="'check-square'">
    <polyline points="9 11 12 14 22 4"></polyline>
    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
  </g>

  <!-- Heart -->
  <g *ngSwitchCase="'heart'">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
  </g>

  <!-- Rocket -->
  <g *ngSwitchCase="'rocket'">
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
    <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
  </g>

  <!-- Shield -->
  <g *ngSwitchCase="'shield'">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
  </g>

  <!-- Star -->
  <g *ngSwitchCase="'star'">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
  </g>

  <!-- Gift -->
  <g *ngSwitchCase="'gift'">
    <polyline points="20 12 20 22 4 22 4 12"></polyline>
    <rect x="2" y="7" width="20" height="5"></rect>
    <line x1="12" y1="22" x2="12" y2="7"></line>
    <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
    <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
  </g>

  <!-- Trophy -->
  <g *ngSwitchCase="'trophy'">
    <path d="M8 21h8"></path>
    <path d="M12 17v4"></path>
    <path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path>
    <path d="M4 6h3v3a3 3 0 0 1-3-3z"></path>
    <path d="M20 6h-3v3a3 3 0 0 0 3-3z"></path>
  </g>

  <!-- Wrench -->
  <g *ngSwitchCase="'wrench'">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
  </g>

  <!-- Mic -->
  <g *ngSwitchCase="'mic'">
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
    <line x1="12" y1="19" x2="12" y2="23"></line>
    <line x1="8" y1="23" x2="16" y2="23"></line>
  </g>

  <!-- Copy -->
  <g *ngSwitchCase="'copy'">
    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
  </g>

  <!-- Download -->
  <g *ngSwitchCase="'download'">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <polyline points="7 10 12 15 17 10"></polyline>
    <line x1="12" y1="15" x2="12" y2="3"></line>
  </g>

  <!-- Check -->
  <g *ngSwitchCase="'check'">
    <polyline points="20 6 9 17 4 12"></polyline>
  </g>

  <!-- User Check -->
  <g *ngSwitchCase="'user-check'">
    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
    <circle cx="8.5" cy="7" r="4"></circle>
    <polyline points="17 11 19 13 23 9"></polyline>
  </g>

  <!-- Briefcase -->
  <g *ngSwitchCase="'briefcase'">
    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
  </g>

  <!-- Edit 3 / Edit -->
  <g *ngSwitchCase="'edit-3'">
    <path d="M12 20h9"></path>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
  </g>
  <g *ngSwitchCase="'edit'">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
  </g>

  <!-- Trash 2 / Trash -->
  <g *ngSwitchCase="'trash-2'">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    <line x1="10" y1="11" x2="10" y2="17"></line>
    <line x1="14" y1="11" x2="14" y2="17"></line>
  </g>
  <g *ngSwitchCase="'trash'">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
  </g>

  <!-- X / Close -->
  <g *ngSwitchCase="'x'">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </g>

  <!-- Eye Off -->
  <g *ngSwitchCase="'eye-off'">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
    <line x1="1" y1="1" x2="23" y2="23"></line>
  </g>

  <!-- Activity -->
  <g *ngSwitchCase="'activity'">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
  </g>

  <!-- Loader / Spinner -->
  <g *ngSwitchCase="'loader'">
    <line x1="12" y1="2" x2="12" y2="6"></line>
    <line x1="12" y1="18" x2="12" y2="22"></line>
    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
    <line x1="2" y1="12" x2="6" y2="12"></line>
    <line x1="18" y1="12" x2="22" y2="12"></line>
    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
  </g>

  <!-- Default fallback -->
  <g *ngSwitchDefault>
    <circle cx="12" cy="12" r="10"></circle>
  </g>
</svg>
